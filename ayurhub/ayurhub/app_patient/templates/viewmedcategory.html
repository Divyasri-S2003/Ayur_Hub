{% load static %}
{% include 'Layout/Partials/Patients/header.html' %}

<main id="main" style="margin-top: 120px;">

  <section class="page-title" style="padding: 50px 0; background: #f8f9fa;">
    <div class="container text-center">
      <h1 style="font-weight: 700; color: #2c4964;">CATEGORIES</h1>
    </div>
  </section>

  <section id="services" class="services section" style="padding: 60px 0;">
    <div class="container">
      <div class="row gy-4">
        
        {% for i in medcat %}
        <div class="col-lg-4 col-md-6">
          <a href="{% url 'app_patient:vproduct' i.id %}" style="text-decoration: none; color: inherit; display: block;">
            <div class="service-item" style="background: #fff; box-shadow: 0px 5px 25px rgba(0, 0, 0, 0.07); border-radius: 12px; overflow: hidden; height: 100%; transition: 0.3s;">
              
              <div class="img-wrapper" style="width: 100%; aspect-ratio: 4 / 3; overflow: hidden; background: #fdfdfd;">
                <img src="{{ i.img.url }}" alt="{{ i.name }}" style="width: 100%; height: 100%; object-fit: cover; display: block;">
              </div>

              <div class="service-content" style="padding: 20px; text-align: center;">
                <h3 style="font-weight: 700; color: #2c4964; margin: 0; font-size: 1.25rem;">{{ i.name }}</h3>
              </div>

            </div>
          </a>
        </div>
        {% endfor %}

      </div>
    </div>
  </section>

</main>

{% include 'Layout/Partials/Patients/footer.html' %}
