{% load static %}
{% include 'Layout/Partials/Patients/header.html' %}

<main id="main" style="margin-top: 120px;">

  <section class="page-title" style="padding: 50px 0; background: #f8f9fa;">
    <div class="container text-center">
      <h1 style="font-weight: 700; color: #2c4964;">Our Medicines</h1>
    </div>
  </section>

  <section id="services" class="services section" style="padding: 60px 0;">
    <div class="container">
      <div class="row gy-4">
        
        {% for i in vprod %}
        <div class="col-lg-4 col-md-6">
          <a href="{% url 'app_patient:vproduct' i.id %}" style="text-decoration: none; color: inherit; display: block; height: 100%;">
            <div class="service-item" style="background: #fff; padding: 20px; box-shadow: 0px 5px 25px rgba(0, 0, 0, 0.07); border-radius: 12px; height: 100%; transition: 0.3s; display: flex; flex-direction: column;">
              
              <div class="img-wrapper" style="overflow: hidden; border-radius: 10px; height: 250px; margin-bottom: 20px; background-color: #fdfdfd; display: flex; align-items: center; justify-content: center;">
                <img src="{{ i.img.url }}" alt="{{ i.productname }}" style="width: 100%; height: 100%; object-fit: cover; display: block;">
              </div>

              <div class="service-content" style="flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between;">
                <div>
                  <h3 style="font-weight: 700; color: #2c4964; font-size: 1.2rem; margin-bottom: 10px; text-align: center;">{{ i.productname }}</h3>
    
                </div>

                <div style="margin-top: auto;">
                  <div style="font-size: 1.25rem; font-weight: 700; color: #1977cc; margin-bottom: 15px; text-align: center;">
                    ₹{{ i.price }}
                  </div>
                  
                  <button onclick="event.preventDefault(); window.location.href='#'" 
                          style="width: 100%; background: #1977cc; color: #fff; border: none; padding: 10px; border-radius: 5px; font-weight: 600; cursor: pointer;">
                    Add to Cart <i class="bi bi-cart-plus"></i>
                  </button>
                </div>
              </div>

            </div>
          </a>
        </div>
        {% endfor %}

      </div>
    </div>
  </section>

</main>

{% include 'Layout/Partials/Patients/footer.html' %}
