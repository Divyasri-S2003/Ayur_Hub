{% load static %}
{% include 'Layout/Partials/Patients/header.html' %}

<main id="main" style="margin-top: 120px;">

  <section class="page-title" style="padding: 50px 0; background: #f8f9fa;">
    <div class="container text-center">
      <h1 style="font-weight: 700; color: #2c4964;">Therapies</h1>
      <nav>
        <!-- <a href="/" style="text-decoration: none; color: #1977cc;">Home</a> / <span style="color: #6c757d;">Services</span> -->
      </nav>
    </div>
  </section>

  <section id="services" class="services section" style="padding: 60px 0;">
    <div class="container">
      <div class="row gy-4">
        
        {% for i in viewcat %}
        <div class="col-lg-4 col-md-6">
          <div class="service-item" style="background: #fff; padding: 25px; box-shadow: 0px 5px 25px rgba(0, 0, 0, 0.07); border-radius: 12px; height: 100%;">
            
            <div class="img-wrapper" style="overflow: hidden; border-radius: 10px; height: 200px; margin-bottom: 20px;">
              <img src="{{ i.img.url }}" alt="{{ i.name }}" class="img-fluid" style="width: 100%; height: 100%; object-fit: cover;">
            </div>

            <div class="service-content">
              <h3 style="font-weight: 700; color: #2c4964;">{{ i.name }}</h3>
              <p style="color: #6c757d; font-size: 0.9rem;">High-quality healthcare and ayurvedic consultation for {{ i.name }}.</p>
              
              <a href="{% url 'app_patient:viewtherapy' i.id %}" style="color: #1977cc; font-weight: 600; text-decoration: none;">
                Learn More <i class="bi bi-arrow-right"></i>
              </a>
            </div>

          </div>
        </div>
        {% endfor %}

      </div>
    </div>
  </section>

</main>

{% include 'Layout/Partials/Patients/footer.html' %}
