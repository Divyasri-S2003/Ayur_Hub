{% load static %}
{% include 'Layout/Partials/Admin/header.html' %}

<style>
    /* --- Ayurvedic Theme Variables --- */
    :root {
        --ayur-dark-green: #2E5C3E;
        --ayur-sage: #4A7C59;
        --ayur-cream: #FAF9F6;
        --ayur-border: #cddbc4;
        --ayur-gold: #D4A017;
    }

    /* Page Background */
    .page-wrapper {
        background-color: var(--ayur-cream) !important;
    }

    /* Card Styling */
    .card-ayurveda {
        border: none;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(46, 92, 62, 0.1); /* Subtle green shadow */
        background-color: #ffffff;
        overflow: hidden;
    }

    .card-header-ayurveda {
        background-color: var(--ayur-dark-green);
        color: #ffffff;
        padding: 15px 20px;
        border-bottom: 3px solid var(--ayur-gold);
    }

    /* Form Input Styling */
    .form-label {
        color: var(--ayur-dark-green);
        font-weight: 600;
    }

    .form-control {
        border: 1px solid var(--ayur-border);
        border-radius: 8px;
        padding: 10px;
        background-color: #fafbf9; /* Very faint green tint */
    }

    .form-control:focus {
        border-color: var(--ayur-sage);
        box-shadow: 0 0 0 0.2rem rgba(74, 124, 89, 0.25); /* Green focus glow */
        background-color: #fff;
    }

    /* Button Styling */
    .btn-ayurveda {
        background-color: var(--ayur-dark-green);
        border: none;
        color: white;
        padding: 10px 25px;
        border-radius: 6px;
        font-weight: 600;
        transition: all 0.3s ease;
    }

    .btn-ayurveda:hover {
        background-color: var(--ayur-sage);
        transform: translateY(-2px);
    }
</style>

<div class="page-wrapper">
    <div class="content">
        <div class="body-wrapper-inner">
            <div class="container-fluid">
                
                <div class="card card-ayurveda mt-4">
                    
                    <div class="card-header-ayurveda">
                        <h5 class="mb-0 fw-bold" style="color: white;">
                            <i class="fa fa-leaf me-2"></i> Add New Category
                        </h5>
                    </div>

                    <div class="card-body p-4">
                        
                        <form method="POST" action="{% url 'core:category' %}" enctype="multipart/form-data">
                            {% csrf_token %} 
                            
                            <div class="mb-4">
                                <label for="exampleInputcatname" class="form-label">Category Name</label>
                                <div class="input-group">
                                    <span class="input-group-text" style="background-color: #e9f2eb; border-color: var(--ayur-border);">
                                        <i class="fa fa-tag text-success"></i>
                                    </span>
                                    <input type="text" class="form-control" id="exampleInputcatname" name="name" placeholder="Enter category name (e.g., Panchakarma)" aria-describedby="nameHelp">
                                </div>
                                <div id="nameHelp" class="form-text text-muted">Enter the name of the treatment or therapy category.</div>
                            </div>

                            <div class="mb-4">
                                <label for="exampleInputimage" class="form-label">Category Image</label>
                                <input type="file" class="form-control" id="exampleInputimage" name="img">
                                <small class="text-muted">Upload a clear image representative of the category.</small>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <button type="submit" class="btn btn-ayurveda">
                                    <i class="fa fa-check-circle"></i> Save Category
                                </button>
                            </div>

                        </form>
                        </div>
                </div>
                
            </div>
        </div>
    </div>
</div>

{% include 'Layout/Partials/Admin/footer.html' %}
