{% load static %}
{% include 'Layout/Partials/Admin/header.html' %}

<style>
    /* --- Ayurvedic Theme Variables --- */
    :root {
        --ayur-dark-green: #2E5C3E;
        --ayur-sage: #4A7C59;
        --ayur-cream: #FAF9F6;
        --ayur-border: #cddbc4;
        --ayur-gold: #D4A017;
    }

    /* Page Background */
    .page-wrapper {
        background-color: var(--ayur-cream) !important;
    }

    /* Card Styling */
    .card-ayurveda {
        border: none;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(46, 92, 62, 0.1);
        background-color: #ffffff;
        overflow: hidden;
    }

    .card-header-ayurveda {
        background-color: var(--ayur-dark-green);
        color: #ffffff;
        padding: 15px 20px;
        border-bottom: 3px solid var(--ayur-gold);
    }

    /* Form Styles */
    .form-label {
        color: var(--ayur-dark-green);
        font-weight: 600;
        font-size: 0.95rem;
    }

    .form-control, .form-select {
        border: 1px solid var(--ayur-border);
        border-radius: 8px;
        padding: 10px;
        background-color: #fafbf9;
    }

    .form-control:focus, .form-select:focus {
        border-color: var(--ayur-sage);
        box-shadow: 0 0 0 0.2rem rgba(74, 124, 89, 0.25);
        background-color: #fff;
    }

    /* Input Group Icons */
    .input-group-text {
        background-color: #e9f2eb;
        border-color: var(--ayur-border);
        color: var(--ayur-sage);
    }

    /* Button Styling */
    .btn-ayurveda {
        background-color: var(--ayur-dark-green);
        border: none;
        color: white;
        padding: 12px 30px;
        border-radius: 6px;
        font-weight: 600;
        transition: all 0.3s ease;
    }

    .btn-ayurveda:hover {
        background-color: var(--ayur-sage);
        transform: translateY(-2px);
    }
</style>

<div class="page-wrapper">
    <div class="content">
        <div class="body-wrapper-inner">
            <div class="container-fluid">
                
                <div class="card card-ayurveda mt-4">
                    
                    <div class="card-header-ayurveda">
                        <h5 class="mb-0 fw-bold text-white">
                            <i class="fa fa-cubes me-2"></i> Add New Product
                        </h5>
                    </div>

                    <div class="card-body p-4">
                        <form method="POST" action="{% url 'core:product' %}" enctype="multipart/form-data">
                            {% csrf_token %} 
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Medicine Category</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa fa-list-alt"></i></span>
                                        <select name="medicinecategory" class="form-select" id="exampleInputmedicinecategory">
                                            <option value="" selected disabled>Select Category</option>
                                            {% for i in list %}
                                            <option value="{{i.id}}">{{i.name}}</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Product Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa fa-medkit"></i></span>
                                        <input type="text" class="form-control" name="productname" placeholder="e.g. Chyavanprash">
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Price (₹)</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa fa-inr"></i></span>
                                        <input type="text" class="form-control" name="price" placeholder="0.00">
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Stock Quantity</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa fa-sort-numeric-asc"></i></span>
                                        <input type="text" class="form-control" name="quantity" placeholder="Available units">
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Product Description</label>
                                <textarea class="form-control" name="description" rows="3" placeholder="Enter details about ingredients, usage, etc."></textarea>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Product Image</label>
                                <input type="file" class="form-control" name="img">
                                <small class="text-muted">Upload a clear image of the product packaging.</small>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <button type="submit" class="btn btn-ayurveda">
                                    <i class="fa fa-check-circle me-1"></i> Save Product
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

{% include 'Layout/Partials/Admin/footer.html' %}
