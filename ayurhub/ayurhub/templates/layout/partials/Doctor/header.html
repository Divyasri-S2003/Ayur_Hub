    
    {% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard | AyurHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --ayur-green: #2E5C3E;
            --ayur-dark: #1a3c27;
            --ayur-gold: #D4A017;
            --bg-light: #f4f7f6;
            --text-grey: #6c757d;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-light);
            overflow-x: hidden;
        }

        /* --- Sidebar --- */
        .sidebar {
            height: 100vh;
            width: 260px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #ffffff;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            padding-top: 20px;
            z-index: 1000;
        }

        .sidebar-brand {
            padding: 0 25px 30px;
            display: flex;
            align-items: center;
            color: var(--ayur-green);
            font-weight: 700;
            font-size: 24px;
        }

        .sidebar-brand i { color: var(--ayur-gold); margin-right: 10px; }

        .nav-link {
            color: #555;
            padding: 15px 25px;
            font-size: 15px;
            display: flex;
            align-items: center;
            transition: 0.3s;
            border-left: 4px solid transparent;
        }

        .nav-link i { width: 30px; font-size: 18px; }

        .nav-link:hover, .nav-link.active {
            background-color: #f0f7f2;
            color: var(--ayur-green);
            border-left-color: var(--ayur-green);
        }

        /* --- Main Content --- */
        .main-content {
            margin-left: 260px;
            padding: 30px;
        }

        /* --- Header --- */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .date-badge {
            background: #fff;
            padding: 8px 15px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-size: 14px;
            color: var(--ayur-green);
            font-weight: 500;
        }

        /* --- Stats Cards --- */
        .stat-card {
            background: #fff;
            border-radius: 15px;
            padding: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            transition: 0.3s;
            border-bottom: 4px solid transparent;
        }

        .stat-card:hover { transform: translateY(-5px); }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .stat-info h3 { margin: 0; font-weight: 700; color: #333; }
        .stat-info p { margin: 0; color: var(--text-grey); font-size: 14px; }

        .card-green { border-color: var(--ayur-green); }
        .card-green .stat-icon { background: rgba(46, 92, 62, 0.1); color: var(--ayur-green); }

        .card-gold { border-color: var(--ayur-gold); }
        .card-gold .stat-icon { background: rgba(212, 160, 23, 0.1); color: var(--ayur-gold); }

        /* --- Appointments Table Section --- */
        .table-container {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            padding: 0;
            overflow: hidden;
            margin-top: 30px;
        }

        .table-header {
            padding: 20px 25px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-title { font-size: 18px; font-weight: 600; color: var(--ayur-dark); }

        .custom-table { width: 100%; }
        .custom-table thead { background-color: #f8f9fa; }
        .custom-table th {
            padding: 15px 25px;
            font-weight: 600;
            color: var(--text-grey);
            font-size: 13px;
            text-transform: uppercase;
            border: none;
        }
        .custom-table td {
            padding: 20px 25px;
            vertical-align: middle;
            border-bottom: 1px solid #f2f2f2;
        }
        .custom-table tr:hover { background-color: #fafafa; }

        /* --- Badges --- */
        .badge-status { padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; }
        .badge-completed { background: #e6f7ed; color: #2E5C3E; }
        .badge-pending { background: #fff8e1; color: #D4A017; }
        
        .btn-action {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            text-decoration: none;
            transition: 0.2s;
            background: var(--ayur-green);
            color: #fff;
            border: none;
        }
        .btn-action:hover { background: var(--ayur-dark); color: #fff; }

        /* Style for the special Therapy button */
        .btn-therapy {
            background: var(--ayur-gold);
            color: white;
        }
        .btn-therapy:hover {
            background: #b58912;
            color: white;
        }

        .filter-input {
            border: 1px solid #ddd;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            outline: none;
        }
        .filter-btn {
            background: var(--ayur-gold);
            color: white;
            border: none;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 13px;
            margin-left: 5px;
        }

    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-leaf"></i> AyurHub
        </div>
         <nav class="nav flex-column">
            <a class="nav-link active" href="/doctordashboard/">
                <i class="fas fa-th-large"></i> Dashboard
            </a>
            <a class="nav-link" href="#">
                <i class="fas fa-user-injured"></i> Patients
            </a>
            <a class="nav-link" href="/doctor/manageappointments/">
                <i class="fas fa-calendar-check"></i> Appointments
            </a>
        
            {% if is_therapy_admin %}
            <a class="nav-link" href="/doctor/manage-therapy/">
                <i class="fas fa-spa"></i> Therapy Appointments
            </a>
            {% endif %}
            

            <a class="nav-link" href="/doctor/appointment-details/">
                <i class="fas fa-file-prescription"></i> Prescriptions
            </a>
            <a class="nav-link" href="logout/">
                <i class="fas fa-cog"></i> Logout
                        </a>

        </nav> 


    </div>
